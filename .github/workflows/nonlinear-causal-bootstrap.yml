name: Nonlinear causal bootstrap

on:
  push:
    branches: [codex/nonlinear-causal-pass]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nonlinear-causal-bootstrap
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/nonlinear-causal-pass
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply, verify, and publish diagnostics or implementation
        env:
          BRANCH_NAME: codex/nonlinear-causal-pass
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/nonlinear-causal-bootstrap.log
          : > "$LOG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          fail_stage() {
            local status="$1"
            local stage="$2"
            cp "$LOG" /tmp/nonlinear-causal-bootstrap.saved.log
            git reset --hard HEAD
            git clean -fd
            mkdir -p docs
            {
              echo "# Nonlinear causal bootstrap failure"
              echo
              echo "The guarded production pass stopped before committing implementation files."
              echo
              echo "**Failed stage:** ${stage}"
              echo
              echo '```text'
              tail -n 900 /tmp/nonlinear-causal-bootstrap.saved.log
              echo '```'
            } > docs/NONLINEAR_CAUSAL_FAILURE.md
            git add docs/NONLINEAR_CAUSAL_FAILURE.md
            git commit -m "Record nonlinear causal bootstrap failure"
            git push origin "HEAD:${BRANCH_NAME}"
            exit "$status"
          }

          run_stage() {
            local stage="$1"
            shift
            echo | tee -a "$LOG"
            echo "===== ${stage} =====" | tee -a "$LOG"
            set +e
            "$@" 2>&1 | tee -a "$LOG"
            local status="${PIPESTATUS[0]}"
            set -e
            if [ "$status" -ne 0 ]; then
              fail_stage "$status" "$stage"
            fi
          }

          run_stage "Install dependencies" npm ci
          run_stage "Repair guarded UI codemod literals" python scripts/repair-nonlinear-ui.py
          run_stage "Check core codemod syntax" node --check scripts/apply-nonlinear-core.mjs
          run_stage "Check UI codemod syntax" node --check scripts/apply-nonlinear-ui.mjs
          run_stage "Check test-route codemod syntax" node --check scripts/apply-nonlinear-test-routes.mjs
          run_stage "Apply canonical changes" node scripts/apply-nonlinear-core.mjs
          run_stage "Apply investigation and presentation changes" node scripts/apply-nonlinear-ui.mjs
          run_stage "Apply valid legacy test routes" node scripts/apply-nonlinear-test-routes.mjs
          run_stage "Lint" npm run lint
          run_stage "Test" npm run test
          run_stage "Build" npm run build
          run_stage "Patch hygiene" git diff --check

          rm -f docs/NONLINEAR_CAUSAL_FAILURE.md
          rm scripts/apply-nonlinear-core.mjs
          rm scripts/apply-nonlinear-ui.mjs
          rm scripts/apply-nonlinear-test-routes.mjs
          rm scripts/repair-nonlinear-ui.py
          rm .github/workflows/nonlinear-causal-bootstrap.yml

          git add -A
          if git diff --cached --quiet; then
            fail_stage 1 "Commit verified implementation: no changes produced"
          fi
          git commit -m "Implement deterministic nonlinear causal gameplay"
          git push origin "HEAD:${BRANCH_NAME}"
