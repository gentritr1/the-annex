name: Nonlinear causal bootstrap

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nonlinear-causal-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair guarded UI codemod literal
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/apply-nonlinear-ui.mjs')
          source = path.read_text()
          before = "    setWorldLine(`${causalSiteState.title}. Procedural change acknowledged; ordinary methods are available.`)\n"
          after = "    setWorldLine(causalSiteState.title + '. Procedural change acknowledged; ordinary methods are available.')\n"
          count = source.count(before)
          if count != 1:
              raise SystemExit(f'expected exactly one UI literal repair target, found {count}')
          path.write_text(source.replace(before, after))

      - name: Validate guarded codemods
        run: |
          node --check scripts/apply-nonlinear-core.mjs
          node --check scripts/apply-nonlinear-ui.mjs

      - name: Apply canonical and UI changes
        run: |
          node scripts/apply-nonlinear-core.mjs
          node scripts/apply-nonlinear-ui.mjs

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check patch hygiene
        run: git diff --check

      - name: Remove one-shot bootstrap files
        run: |
          rm scripts/apply-nonlinear-core.mjs
          rm scripts/apply-nonlinear-ui.mjs
          rm .github/workflows/nonlinear-causal-bootstrap.yml

      - name: Commit verified implementation
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes were produced."
            exit 1
          fi
          git commit -m "Implement deterministic nonlinear causal gameplay"
          git push origin "HEAD:${BRANCH_NAME}"
