<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Deposition Annex — Ellis Marne, scene-first redesign</title>
<style>
  /* ============================================================
     THE ANNEX — Case 81, Deposition Annex — scene-first prototype
     Grammar matched to public/care-ward-redesign.html (approved standard):
       scene fills viewport · choices are in-scene ring-zones ·
       hover/focus previews the room within ~300ms in ABSOLUTE values ·
       arm→confirm on the zone · dialogue staged over the scene with
       length-scaled holds · mechanics arrive last as one compact strip.
     Palette (from src/styles.css, read-only):
       --night oklch(0.09 0 0) · amber ~oklch(0.75 0.12 75)
       · cyan ~oklch(0.78 0.11 190)

     SCAR HONORED (care-ward's one taught lesson): "a looping photographic
     texture must never visibly reset." This scene has NO drifting photo
     layer — atmosphere (dust in the light shaft) is procedural <canvas>,
     which never snaps at a loop point, and it is killed under reduce-motion.
     ============================================================ */
  :root {
    --night: oklch(0.08 0.006 250);
    --night-soft: oklch(0.12 0.008 250);
    --record: oklch(0.94 0.012 210);
    --fog: oklch(0.72 0.018 215);
    --fog-dim: oklch(0.58 0.018 220);
    --amber: oklch(0.75 0.12 75);
    --amber-soft: oklch(0.86 0.08 80);
    --cyan: oklch(0.78 0.11 190);
    --cyan-soft: oklch(0.85 0.07 195);
    --line: oklch(0.32 0.018 235);
    --refuse: oklch(0.66 0.17 30);
    --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

    /* ---- AMBIENT DEFAULTS (rest). Every state below overrides these; the
       absolute value tables live in the README. All are read at settled
       target with transitions disabled. ---- */
    --grade: brightness(0.8) contrast(1.06) saturate(0.9) hue-rotate(0deg);
    --shaft-color: oklch(0.82 0.08 80);
    --shaft-op: 0.34;
    --shaft-blur: 6px;
    --vig: 0.60;
    --vig-cx: 50%;
    --vig-cy: 46%;
    --vig-size: 74%;
    --ellis-op: 0.90;
    --ellis-scale: 1;
    --ellis-contrast: 1;
    --ellis-bright: 0.92;
    --halo-op: 0.16;
    --wash-warm-op: 0;
    --wash-cold-op: 0;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--night);
    color: var(--record);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  body { min-width: 320px; }

  /* ---- STAGE: plate fills viewport, letterboxed, max ~1600 ---- */
  .stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--night);
  }
  .plate {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9), 1600px);
    aspect-ratio: 16 / 9;
    max-height: 100vh;
    overflow: hidden;
    background: #000;
    box-shadow: 0 0 140px oklch(0 0 0 / 0.92) inset;
  }

  /* whole photographic stack takes the reactive temperature grade */
  .grade {
    position: absolute;
    inset: 0;
    filter: var(--grade);
    transition: filter 300ms var(--ease-out);
  }
  .layer { position: absolute; inset: 0; }

  /* master plate (the bright annex interior) */
  .plate-base {
    background: #05070a url('/images/case-81-deposition-annex.webp') center/cover no-repeat;
  }
  /* CONSTANT value-match layer: the source plate reads far brighter than the
     care-ward plate, so a fixed multiply grade pulls the walls into rain-dark
     before any state grade applies. Not reactive — this is the floor. */
  .darken {
    background:
      radial-gradient(ellipse 90% 80% at 50% 44%, oklch(0.16 0.02 245 / 0.30), transparent 72%),
      linear-gradient(oklch(0.06 0.015 250 / 0.62), oklch(0.05 0.012 250 / 0.72));
    mix-blend-mode: multiply;
  }

  /* light shaft from the pendant lamp — screen-blended cone. Opacity, blur and
     hue are the core reactive signal: sworn steadies+warms, cross hardens+cools. */
  .shaft {
    background: linear-gradient(to bottom,
      var(--shaft-color) 0%,
      color-mix(in oklch, var(--shaft-color), transparent 55%) 46%,
      transparent 90%);
    clip-path: polygon(45.5% 12%, 51.5% 12%, 67% 96%, 32% 96%);
    mix-blend-mode: screen;
    opacity: var(--shaft-op);
    filter: blur(var(--shaft-blur));
    transition: opacity 300ms var(--ease-out), filter 300ms var(--ease-out),
                background 300ms var(--ease-out);
    pointer-events: none;
  }

  /* procedural dust motes in the shaft (killed under reduce-motion) */
  #dust-canvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0.9;
  }

  /* soft halo that keeps Ellis legible when the room dims around them */
  .ellis-halo {
    background: radial-gradient(ellipse 26% 40% at var(--ellis-x, 40%) 52%,
      oklch(0.7 0.03 250 / 0.9), transparent 70%);
    mix-blend-mode: screen;
    opacity: var(--halo-op);
    transition: opacity 300ms var(--ease-out);
    pointer-events: none;
  }

  /* Ellis Marne — background-removed cutout placed at the table.
     Presence is a STATE: baseline 0.90, pressed/refusal 0.66, never gone. */
  .ellis {
    position: absolute;
    left: 40%;
    bottom: 5.5%;
    width: 31%;
    transform: translateX(-50%) scale(var(--ellis-scale));
    transform-origin: 50% 100%;
    opacity: var(--ellis-op);
    filter: brightness(var(--ellis-bright)) contrast(var(--ellis-contrast));
    transition: opacity 320ms var(--ease-out), transform 320ms var(--ease-out),
                filter 320ms var(--ease-out);
    pointer-events: none;
    z-index: 6;
  }
  .ellis img { display: block; width: 100%; height: auto; }

  /* small dossier prop resting on the table edge — present, never dominant */
  .dossier {
    position: absolute;
    left: 59.5%;
    top: 45.5%;
    width: 5%;
    transform: rotate(-6deg);
    opacity: 0.38;
    filter: brightness(0.5) contrast(1.08) saturate(0.8);
    box-shadow: 0 6px 18px oklch(0 0 0 / 0.8);
    pointer-events: none;
    z-index: 5;
    border: 1px solid oklch(0.42 0.01 240 / 0.5);
  }
  .dossier img { display: block; width: 100%; height: auto; }

  /* warm (Ellis side) / cold (examiner side) presence washes */
  .wash {
    pointer-events: none;
    opacity: 0;
    transition: opacity 300ms var(--ease-out);
    mix-blend-mode: screen;
    z-index: 7;
  }
  .wash.warm {
    background: radial-gradient(ellipse 42% 54% at 34% 54%,
      oklch(0.78 0.12 76 / 0.5), transparent 70%);
    opacity: var(--wash-warm-op);
  }
  .wash.cold {
    background: radial-gradient(ellipse 40% 52% at 70% 50%,
      oklch(0.72 0.11 205 / 0.5), transparent 70%);
    opacity: var(--wash-cold-op);
  }
  /* cold pulse when a verb-hover snaps to interrupt */
  .plate[data-state="interrupt"] .wash.cold { animation: cold-pulse 620ms var(--ease-out); }
  @keyframes cold-pulse {
    0%   { opacity: 0.98; }
    100% { opacity: var(--wash-cold-op); }
  }

  /* vignette (tightens under pressure, closes tight around Ellis on refusal) */
  .vignette {
    background: radial-gradient(ellipse var(--vig-size) calc(var(--vig-size) - 6%)
      at var(--vig-cx) var(--vig-cy),
      transparent 0%, transparent 40%, oklch(0 0 0 / var(--vig)) 100%);
    transition: background 320ms var(--ease-out);
    pointer-events: none;
    z-index: 8;
  }

  /* ============ PER-STATE AMBIENT VARIABLE SETS ============ */
  .plate[data-state="sworn"] {
    --grade: brightness(0.92) contrast(1.0) saturate(1.06) hue-rotate(-8deg);
    --shaft-color: oklch(0.84 0.11 78);
    --shaft-op: 0.52; --shaft-blur: 5px;
    --vig: 0.50; --vig-cx: 48%; --vig-cy: 46%; --vig-size: 80%;
    --ellis-op: 0.90; --ellis-scale: 1; --ellis-contrast: 1;
    --wash-warm-op: 0.70; --wash-cold-op: 0; --halo-op: 0.20;
  }
  .plate[data-state="cross"] {
    --grade: brightness(0.70) contrast(1.24) saturate(0.82) hue-rotate(12deg);
    --shaft-color: oklch(0.85 0.09 205);
    --shaft-op: 0.62; --shaft-blur: 1.5px;
    --vig: 0.82; --vig-cx: 54%; --vig-cy: 44%; --vig-size: 66%;
    --ellis-op: 0.86; --ellis-scale: 0.992; --ellis-contrast: 1.12;
    --wash-warm-op: 0; --wash-cold-op: 0.75; --halo-op: 0.14;
  }
  .plate[data-state="letstand"] {
    --grade: brightness(0.82) contrast(1.06) saturate(0.92) hue-rotate(0deg);
    --shaft-color: oklch(0.82 0.08 82);
    --shaft-op: 0.36; --shaft-blur: 6px;
    --vig: 0.60; --vig-cx: 50%; --vig-cy: 46%; --vig-size: 74%;
    --ellis-op: 0.90; --ellis-scale: 1; --ellis-contrast: 1;
    --wash-warm-op: 0; --wash-cold-op: 0; --halo-op: 0.16;
  }
  .plate[data-state="interrupt"] {
    --grade: brightness(0.66) contrast(1.30) saturate(0.80) hue-rotate(14deg);
    --shaft-color: oklch(0.86 0.10 202);
    --shaft-op: 0.66; --shaft-blur: 1px;
    --vig: 0.86; --vig-cx: 55%; --vig-cy: 44%; --vig-size: 64%;
    --ellis-op: 0.66; --ellis-scale: 0.99; --ellis-contrast: 1.14;
    --wash-warm-op: 0; --wash-cold-op: 0.82; --halo-op: 0.12;
  }
  .plate[data-state="corroborate"] {
    --grade: brightness(0.90) contrast(1.02) saturate(1.06) hue-rotate(-8deg);
    --shaft-color: oklch(0.84 0.11 78);
    --shaft-op: 0.50; --shaft-blur: 5px;
    --vig: 0.52; --vig-cx: 49%; --vig-cy: 46%; --vig-size: 78%;
    --ellis-op: 0.90; --ellis-scale: 1; --ellis-contrast: 1;
    --wash-warm-op: 0.72; --wash-cold-op: 0; --halo-op: 0.20;
  }
  .plate[data-state="stillness"] {
    --grade: brightness(0.80) contrast(1.05) saturate(0.88) hue-rotate(0deg);
    --shaft-color: oklch(0.82 0.08 90);
    --shaft-op: 0.42; --shaft-blur: 5px;
    --vig: 0.62; --vig-cx: 46%; --vig-cy: 47%; --vig-size: 72%;
    --ellis-op: 0.90; --ellis-scale: 1; --ellis-contrast: 1;
    --wash-warm-op: 0; --wash-cold-op: 0; --halo-op: 0.22;
  }
  /* THE REFUSAL — room dims, vignette closes on Ellis, Ellis HOLDS 0.66, unmoved */
  .plate[data-state="refusal"] {
    --grade: brightness(0.55) contrast(1.16) saturate(0.80) hue-rotate(6deg);
    --shaft-color: oklch(0.80 0.07 205);
    --shaft-op: 0.22; --shaft-blur: 8px;
    --vig: 0.92; --vig-cx: 40%; --vig-cy: 50%; --vig-size: 58%;
    --ellis-op: 0.66; --ellis-scale: 1; --ellis-contrast: 1.06;
    --ellis-bright: 1.42;  /* holds Ellis lit while the room grade drops to 0.55 */
    --wash-warm-op: 0; --wash-cold-op: 0.50; --halo-op: 0.42;
  }

  /* ---- REST TEXT: site label + one caption ---- */
  .site-label {
    position: absolute;
    top: clamp(12px, 2.4vw, 28px);
    left: clamp(12px, 2.4vw, 30px);
    font-size: clamp(11px, 1.4vw, 15px);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fog);
    z-index: 40;
    text-shadow: 0 1px 8px oklch(0 0 0 / 0.9);
  }
  .rest-caption {
    position: absolute;
    left: 50%;
    bottom: clamp(18px, 5vh, 54px);
    transform: translateX(-50%);
    max-width: 80%;
    text-align: center;
    font-size: clamp(13px, 1.7vw, 18px);
    color: oklch(0.9 0.01 210 / 0.86);
    letter-spacing: 0.01em;
    z-index: 40;
    text-shadow: 0 1px 12px oklch(0 0 0 / 0.95);
    transition: opacity 260ms var(--ease-out);
    pointer-events: none;
  }
  .plate[data-armed] .rest-caption,
  .plate[data-phase]:not([data-phase="entry"]) .rest-caption { opacity: 0; }

  /* ---- CHOICE ZONES (generic) ---- */
  .zone {
    position: absolute;
    transform: translate(-50%, -50%);
    display: grid;
    justify-items: center;
    gap: 8px;
    min-width: 44px;
    min-height: 44px;
    padding: 14px 16px;
    border: 0;
    background: transparent;
    color: var(--record);
    cursor: pointer;
    z-index: 30;
    font: inherit;
    -webkit-tap-highlight-color: transparent;
    opacity: 0;
    pointer-events: none;
    transition: opacity 260ms var(--ease-out);
  }
  .zone[data-live="1"] { opacity: 1; pointer-events: auto; }
  .zone:disabled { cursor: default; }

  .zone-ring {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 1.5px solid oklch(0.86 0.04 210 / 0.35);
    display: grid;
    place-items: center;
    transition: border-color 220ms var(--ease-out),
                box-shadow 220ms var(--ease-out),
                transform 220ms var(--ease-out),
                background 220ms var(--ease-out);
    backdrop-filter: blur(1px);
  }
  .zone-ring::before {
    content: '';
    width: 7px; height: 7px; border-radius: 50%;
    background: oklch(0.86 0.04 210 / 0.55);
    transition: background 220ms var(--ease-out), box-shadow 220ms var(--ease-out);
  }
  /* warm side rings (sworn / corroborate / let / ask) vs cold (cross / interrupt) */
  .zone.warm .zone-ring { border-color: oklch(0.82 0.1 76 / 0.42); }
  .zone.cold .zone-ring { border-color: oklch(0.78 0.1 200 / 0.42); }

  .zone:hover .zone-ring, .zone:focus-visible .zone-ring { transform: scale(1.08); }
  .zone.warm:hover .zone-ring, .zone.warm:focus-visible .zone-ring {
    border-color: var(--amber);
    box-shadow: 0 0 26px oklch(0.75 0.12 75 / 0.5), 0 0 0 1px oklch(0.75 0.12 75 / 0.3);
  }
  .zone.warm:hover .zone-ring::before, .zone.warm:focus-visible .zone-ring::before {
    background: var(--amber-soft); box-shadow: 0 0 10px var(--amber);
  }
  .zone.cold:hover .zone-ring, .zone.cold:focus-visible .zone-ring {
    border-color: var(--cyan);
    box-shadow: 0 0 26px oklch(0.78 0.11 190 / 0.5), 0 0 0 1px oklch(0.78 0.11 190 / 0.3);
  }
  .zone.cold:hover .zone-ring::before, .zone.cold:focus-visible .zone-ring::before {
    background: var(--cyan); box-shadow: 0 0 10px var(--cyan);
  }
  .zone:focus-visible { outline: none; }
  .zone:focus-visible .zone-ring { outline: 2px solid var(--record); outline-offset: 4px; }

  /* armed pulse */
  .plate[data-armed] .zone[data-armed-me="1"].warm .zone-ring {
    border-color: var(--amber-soft);
    box-shadow: 0 0 34px oklch(0.75 0.12 75 / 0.7), 0 0 0 2px var(--amber);
    animation: arm-pulse 1.4s ease-in-out infinite;
  }
  .plate[data-armed] .zone[data-armed-me="1"].cold .zone-ring {
    border-color: var(--cyan);
    box-shadow: 0 0 34px oklch(0.78 0.11 190 / 0.7), 0 0 0 2px var(--cyan);
    animation: arm-pulse 1.4s ease-in-out infinite;
  }
  @keyframes arm-pulse {
    0%,100% { transform: scale(1.06); }
    50%     { transform: scale(1.16); }
  }
  /* dim the un-armed siblings while one is armed */
  .plate[data-armed] .zone[data-live="1"]:not([data-armed-me="1"]) { opacity: 0.28; }

  .zone-cap {
    max-width: 42vw;
    text-align: center;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out);
    pointer-events: none;
    text-shadow: 0 1px 10px oklch(0 0 0 / 0.95);
  }
  .zone:hover .zone-cap, .zone:focus-visible .zone-cap,
  .zone[data-armed-me="1"] .zone-cap { opacity: 1; transform: translateY(0); }
  .zone-cap .cap-title {
    display: block;
    font-size: clamp(12px, 1.55vw, 16px);
    letter-spacing: 0.02em;
    color: var(--record);
  }
  .zone.warm .cap-title { color: var(--amber-soft); }
  .zone.cold .cap-title { color: var(--cyan); }
  .zone-cap .cap-detail {
    display: block;
    margin-top: 3px;
    font-size: clamp(11px, 1.2vw, 13px);
    color: oklch(0.82 0.01 210 / 0.8);
    line-height: 1.35;
  }
  .zone-cap .cap-arm {
    display: none;
    margin-top: 5px;
    font-size: clamp(10px, 1.15vw, 12px);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--amber);
  }
  .zone.cold .cap-arm { color: var(--cyan); }
  .zone[data-armed-me="1"] .cap-arm { display: block; }

  /* ---- STAGED BEAT TEXT (dialogue over the scene) ---- */
  .beat {
    position: absolute;
    left: 50%;
    top: 33%;
    bottom: 15%;              /* definite height (top+bottom) so the flex
                                 column sizes reliably and bottom-aligns text */
    transform: translateX(-50%);
    width: min(74%, 720px);
    z-index: 50;
    display: none;
    flex-direction: column;
    justify-content: flex-end;
    gap: 11px;
    text-align: center;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 22%, black 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, black 22%, black 100%);
  }
  .plate[data-beat] .beat { display: flex; }
  /* while choice rings occupy the lower third, lift the dialogue band so text
     never collides with the ring row */
  .plate[data-phase="verb"] .beat,
  .plate[data-phase="consent"] .beat { top: 20%; bottom: 30%; }
  .beat-line {
    flex: 0 0 auto;          /* never let the flex column squish a line into its neighbour */
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 420ms var(--ease-out), transform 420ms var(--ease-out);
    text-shadow: 0 2px 18px oklch(0 0 0 / 0.98), 0 0 40px oklch(0 0 0 / 0.9);
  }
  .beat-line.show { opacity: 1; transform: translateY(0); }
  .beat-line.speaker {
    font-size: clamp(11px, 1.3vw, 14px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--cyan);
    margin-top: 6px;
  }
  .beat-line.said {
    font-size: clamp(16px, 2.2vw, 25px);
    line-height: 1.42;
    color: var(--record);
    font-weight: 300;
  }
  .beat-line.narration {
    font-size: clamp(14px, 1.8vw, 20px);
    line-height: 1.5;
    color: oklch(0.86 0.012 210 / 0.9);
    font-weight: 300;
    font-style: italic;
  }
  .beat-line.echo {
    font-size: clamp(13px, 1.6vw, 18px);
    line-height: 1.45;
    color: var(--amber-soft);
    font-weight: 300;
  }
  .advance-hint {
    position: absolute;
    left: 50%;
    bottom: clamp(16px, 4vh, 40px);
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.1em;
    color: oklch(0.7 0.01 210 / 0.6);
    z-index: 55;
    display: none;
    animation: hint-fade 2s ease-in-out infinite;
  }
  .plate[data-beat="playing"] .advance-hint { display: block; }
  @keyframes hint-fade { 0%,100%{opacity:0.35} 50%{opacity:0.8} }

  /* ---- CLOSING STRIP ---- */
  .result {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 60;
    transform: translateY(110%);
    transition: transform 460ms var(--ease-out);
    background: linear-gradient(to top, oklch(0.1 0.008 245 / 0.96), oklch(0.1 0.008 245 / 0.72));
    border-top: 1px solid var(--line);
    backdrop-filter: blur(6px);
    padding: 14px clamp(14px, 3vw, 34px);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 22px;
  }
  .plate[data-result] .result { transform: translateY(0); }
  .result .r-line {
    font-size: clamp(12px, 1.5vw, 15px);
    color: var(--record);
    letter-spacing: 0.01em;
  }
  .result .r-line b { color: var(--cyan); font-weight: 600; }
  .result .r-line .sep { color: var(--fog-dim); margin: 0 4px; }
  .result .r-replay {
    margin-left: auto;
    font-size: 13px;
    color: var(--cyan);
    background: transparent;
    border: 1px solid oklch(0.78 0.11 190 / 0.4);
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: background 200ms, border-color 200ms;
    min-height: 44px;
  }
  .result .r-replay:hover, .result .r-replay:focus-visible {
    background: oklch(0.78 0.11 190 / 0.12);
    border-color: var(--cyan);
    outline: none;
  }
  .result .r-replay:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  /* ---- capture-support: faithful hover appearance for evidence stills.
     Driven only by the ?shot= query param (see script); inert in normal use. ---- */
  .zone[data-hover="1"] .zone-cap { opacity: 1; transform: none; }
  .zone[data-hover="1"] .zone-ring { transform: scale(1.08); }
  .zone.warm[data-hover="1"] .zone-ring {
    border-color: var(--amber);
    box-shadow: 0 0 26px oklch(0.75 0.12 75 / 0.5), 0 0 0 1px oklch(0.75 0.12 75 / 0.3);
  }
  .zone.warm[data-hover="1"] .zone-ring::before { background: var(--amber-soft); box-shadow: 0 0 10px var(--amber); }
  .zone.cold[data-hover="1"] .zone-ring {
    border-color: var(--cyan);
    box-shadow: 0 0 26px oklch(0.78 0.11 190 / 0.5), 0 0 0 1px oklch(0.78 0.11 190 / 0.3);
  }
  .zone.cold[data-hover="1"] .zone-ring::before { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }

  /* ---- REDUCE MOTION TOGGLE ---- */
  .rm-toggle {
    position: absolute;
    top: clamp(12px, 2.4vw, 28px);
    right: clamp(12px, 2.4vw, 30px);
    z-index: 45;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--fog);
    background: oklch(0.12 0.006 245 / 0.6);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 12px 7px 14px;
    cursor: pointer;
    min-height: 44px;
    backdrop-filter: blur(4px);
  }
  .rm-toggle:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .rm-switch {
    width: 34px; height: 18px; border-radius: 999px;
    background: var(--line); position: relative; transition: background 200ms;
    flex: 0 0 auto;
  }
  .rm-switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--fog); transition: transform 200ms, background 200ms;
  }
  .rm-toggle[aria-pressed="true"] .rm-switch { background: oklch(0.78 0.11 190 / 0.5); }
  .rm-toggle[aria-pressed="true"] .rm-switch::after { transform: translateX(16px); background: var(--cyan); }

  /* ---- REDUCED MOTION: kill animation, states switch instantly ---- */
  body.reduce-motion * { animation: none !important; transition: none !important; }
  body.reduce-motion #dust-canvas { display: none; }
  body.reduce-motion .beat-line { opacity: 1; transform: none; }
  body.reduce-motion .advance-hint { display: none !important; }

  /* ---- MOBILE ---- */
  @media (max-width: 560px) {
    .plate { width: 100vw; height: 100vh; max-height: 100vh; aspect-ratio: auto; }
    .ellis { width: 46%; left: 38%; bottom: 4%; }
    .dossier { width: 10%; left: 63%; top: 46%; }
    .beat { width: 88%; }
    .beat-line.said { font-size: 16px; }
    .beat-line.narration { font-size: 15px; }
    .zone-cap { max-width: 60vw; }
    .zone-cap .cap-detail { font-size: 11px; }
    .result { flex-direction: column; align-items: flex-start; gap: 8px; }
    .result .r-replay { margin-left: 0; }
    .rest-caption { font-size: 13px; bottom: 84px; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="plate" id="plate" data-state="rest" data-phase="entry">
      <div class="grade">
        <div class="layer plate-base"></div>
        <div class="layer darken"></div>
        <div class="layer shaft"></div>
        <canvas id="dust-canvas"></canvas>
        <div class="layer ellis-halo"></div>
        <div class="ellis" id="ellis"><img src="/images/ellis-marne-scene.webp" alt="Ellis Marne, seated at the deposition table, head lowered" /></div>
        <div class="dossier" id="dossier"><img src="/images/ellis-marne-dossier.webp" alt="Ellis Marne registry photograph" /></div>
        <div class="layer wash warm"></div>
        <div class="layer wash cold"></div>
        <div class="layer vignette"></div>
      </div>

      <span class="site-label">Case 81 · Deposition Annex</span>

      <button type="button" class="rm-toggle" id="rmToggle" aria-pressed="false" aria-label="Reduce motion">
        <span class="rm-switch" aria-hidden="true"></span>
        <span>Reduce motion</span>
      </button>

      <p class="rest-caption" id="restCaption">The city restored its own Deputy Registrar to testify. Ellis Marne is seated.</p>

      <!-- zones are created/positioned per phase by JS -->
      <div id="zoneHost"></div>

      <!-- staged beat -->
      <div class="beat" id="beat" aria-live="polite"></div>
      <div class="advance-hint" id="advanceHint">click or press any key to continue</div>

      <!-- closing strip -->
      <div class="result" id="result" role="status">
        <span class="r-line" id="rLine"></span>
        <button type="button" class="r-replay" id="rReplay">Replay the other path</button>
      </div>
    </div>
  </main>

<script>
(function () {
  'use strict';

  var plate = document.getElementById('plate');
  var body = document.body;
  var zoneHost = document.getElementById('zoneHost');
  var beatEl = document.getElementById('beat');
  var advanceHint = document.getElementById('advanceHint');
  var resultEl = document.getElementById('result');
  var rLine = document.getElementById('rLine');
  var rReplay = document.getElementById('rReplay');
  var rmToggle = document.getElementById('rmToggle');
  var ellisEl = document.getElementById('ellis');
  var canvas = document.getElementById('dust-canvas');

  /* curly-punctuation constants so the source stays legible */
  var RSQ = '’', LSQ = '‘', LDQ = '“', RDQ = '”', EMD = '—';

  /* ---------------- VERBATIM CONTENT ---------------- */
  var SP = { cls: 'speaker', text: 'ELLIS MARNE ' + EMD };

  var STATEMENTS = {
    sworn: {
      1: [ SP,
        { cls: 'said', text: 'I am the account the city assembled from the Lower Span' + RSQ + 's backups.' },
        { cls: 'said', text: 'Deputy Registrar, thirty years on the lower registers.' },
        { cls: 'said', text: 'Ask in order; I will answer in order.' } ],
      2: [ SP,
        { cls: 'said', text: 'When the archive fell, the registers fell with it.' },
        { cls: 'said', text: 'I am what was kept of the office that watched them go dark, minute by minute.' } ],
      3: [ SP,
        { cls: 'said', text: 'In the fourth minute after the collapse, the fourth minute was closed.' },
        { cls: 'said', text: 'It was closed under a seal I knew: the Continuity Directorate' + RSQ + 's.' },
        { cls: 'said', text: 'Whose hand carried it, I am not ' + EMD + ' in this account ' + EMD + ' permitted to say.' } ]
    },
    cross: {
      1: [ SP,
        { cls: 'said', text: 'You want me to prove I am a person before I have said a word.' },
        { cls: 'said', text: 'I filed the name of everyone who crossed the Lower Span.' },
        { cls: 'said', text: 'Press on that, if you like.' } ],
      2: [ SP,
        { cls: 'said', text: 'You keep testing what I remember as if memory were the proof.' },
        { cls: 'said', text: 'I remember the order the lights failed in.' },
        { cls: 'said', text: 'The record does not.' },
        { cls: 'said', text: 'That should trouble you more than it troubles me.' } ],
      3: [ SP,
        { cls: 'said', text: 'You want the fourth minute.' },
        { cls: 'said', text: 'I watched a hand set the Continuity Directorate' + RSQ + 's seal over it and excise it.' },
        { cls: 'said', text: 'I saw the hand. I know the hand.' },
        { cls: 'said', text: 'Pressed, I will give you only the office.' } ]
    }
  };

  var ECHO = {
    1: { let: 'You let Ellis open in their own order.',
         interrupt: 'You cut in and reset the terms.',
         corroborate: 'You matched the thirty years to the record.' },
    2: { let: 'You let the memory of the collapse stand.',
         interrupt: 'You pressed the recall until it strained.',
         corroborate: 'You corroborated the collapse against the log.' },
    3: { let: 'You let Ellis name the office and go no further.',
         interrupt: 'You pressed Ellis to name the hand.',
         corroborate: 'You matched the seal to the assembly log.' }
  };

  var CONSENT_LEAD = {
    sworn: [
      { cls: 'narration', text: 'Ellis reaches the fourth minute in the packet and waits.' },
      { cls: 'narration', text: 'No one has asked whether they want to answer it.' } ],
    cross: [
      { cls: 'narration', text: 'Ellis stops.' },
      { cls: 'narration', text: LSQ + 'Before you press further,' + RSQ + ' they say, ' + LSQ + 'you could ask me something no one here has.' + RSQ } ]
  };

  var CONSENT_ANSWER = {
    sworn: [ SP,
      { cls: 'said', text: 'Yes. I would rather say it in my own voice than have it read out of me.' } ],
    cross: [ SP,
      { cls: 'said', text: 'No. Not pressed like this.' },
      { cls: 'said', text: 'If I ever name it, it will be because I chose to ' + EMD + ' not because you bent me to it.' } ]
  };

  var CLOSING = {
    sworn: [ SP,
      { cls: 'said', text: 'The fourth minute is the one you will want.' },
      { cls: 'said', text: 'When you ask for it, ask whether you want the truth or only the record.' } ],
    cross: [ SP,
      { cls: 'said', text: 'You have what pressing gives you.' },
      { cls: 'said', text: 'Whether it is what happened is a different file ' + EMD + ' and I am still the only one who kept it.' } ]
  };

  /* zone group definitions: title / detail / side / preview-state */
  var ZONES = {
    entry: [
      { id: 'sworn', side: 'warm', x: 37, y: 73, preview: 'sworn',
        title: 'Swear the witness in', detail: 'Oath first. Answers in order.', arm: 'Select again to begin' },
      { id: 'cross', side: 'cold', x: 63, y: 73, preview: 'cross',
        title: 'Cross-examine', detail: 'Press first. Test every claim.', arm: 'Select again to begin' }
    ],
    verb: [
      { id: 'let', side: 'warm', x: 34, y: 82, preview: 'letstand',
        title: 'Let it stand', detail: '', arm: 'Select again to file' },
      { id: 'interrupt', side: 'cold', x: 50, y: 82, preview: 'interrupt',
        title: 'Interrupt', detail: '', arm: 'Select again to file' },
      { id: 'corroborate', side: 'warm', x: 66, y: 82, preview: 'corroborate',
        title: 'Corroborate', detail: '', arm: 'Select again to file' }
    ],
    consent: [
      { id: 'ask', side: 'warm', x: 37, y: 78, preview: 'stillness',
        title: 'Ask whether they consent', detail: 'Let them choose to answer.', arm: 'Select again to ask' },
      { id: 'donotask', side: 'cold', x: 63, y: 78, preview: '__path__',
        title: 'Do not ask', detail: 'Proceed to the fourth minute.', arm: 'Select again to proceed' }
    ]
  };

  /* per-line hold scaled to reading length (subtitle pacing) */
  function lineHold(text) { return Math.min(4500, Math.max(1700, 900 + text.length * 45)); }

  /* ---------------- STATE ---------------- */
  var reduceMotion = false;
  var path = null;             // 'sworn' | 'cross'
  var baseState = 'rest';      // fallback ambient when nothing is previewed
  var phase = 'entry';         // entry | statement | verb | consentLead | consent | answer | closing | done
  var currentBeat = 1;
  var consentResult = null;    // 'asked-yes' | 'asked-no' | 'not asked'
  var armed = null;            // zone id currently armed
  var activeGroup = null;      // 'entry' | 'verb' | 'consent'
  var previewLock = false;     // ignore hover previews during staged text / holds
  var beatTimer = null, beatIndex = 0, beatQueue = null, beatDone = null;
  var seqTimer = null;

  /* ---------------- AMBIENT ---------------- */
  function setState(s) { plate.setAttribute('data-state', s); }
  function restoreBase() { setState(baseState); }

  /* ---------------- ZONE GROUPS ---------------- */
  function clearZones() {
    zoneHost.innerHTML = '';
    armed = null; activeGroup = null;
    plate.removeAttribute('data-armed');
  }

  function showZones(group, focusFirst) {
    clearZones();
    activeGroup = group;
    var defs = ZONES[group];
    defs.forEach(function (def) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'zone ' + def.side;
      btn.style.left = def.x + '%';
      btn.style.top = def.y + '%';
      btn.setAttribute('data-choice', def.id);
      btn.setAttribute('aria-label', def.title + (def.detail ? '. ' + def.detail : ''));
      var cap = '<span class="zone-ring" aria-hidden="true"></span>' +
        '<span class="zone-cap"><span class="cap-title">' + def.title + '</span>' +
        (def.detail ? '<span class="cap-detail">' + def.detail + '</span>' : '') +
        '<span class="cap-arm">' + def.arm + '</span></span>';
      btn.innerHTML = cap;

      var previewState = def.preview === '__path__' ? path : def.preview;
      btn.addEventListener('mouseenter', function () { previewOn(previewState); });
      btn.addEventListener('mouseleave', function () { if (armed !== def.id) previewOff(); });
      btn.addEventListener('focus', function () { previewOn(previewState); });
      btn.addEventListener('blur', function () { if (armed !== def.id) previewOff(); });
      btn.addEventListener('click', function (e) { e.preventDefault(); activate(def.id, previewState); });
      zoneHost.appendChild(btn);
      // reveal on next frame so the opacity transition runs
      requestAnimationFrame(function () { btn.setAttribute('data-live', '1'); });
    });
    // focus the first zone for keyboard flow (mid-flow groups only; the entry
    // group stays unfocused on load so the scene rests neutral until the player
    // hovers or Tabs in — auto-focus would fire the sworn preview immediately)
    if (focusFirst) {
      var first = zoneHost.querySelector('.zone');
      if (first) { try { first.focus(); } catch (e) {} }
    }
  }

  function previewOn(s) { if (previewLock) return; setState(s); }
  function previewOff() { if (previewLock || armed) return; restoreBase(); }

  function activate(id, previewState) {
    if (previewLock) return;
    if (armed === id) { commitZone(id); return; }
    armed = id;
    plate.setAttribute('data-armed', id);
    // mark which button is armed and hold its preview
    Array.prototype.forEach.call(zoneHost.querySelectorAll('.zone'), function (z) {
      z.setAttribute('data-armed-me', z.getAttribute('data-choice') === id ? '1' : '0');
    });
    setState(previewState);
    var el = zoneHost.querySelector('.zone[data-choice="' + id + '"]');
    if (el) { try { el.focus(); } catch (e) {} }
  }

  function disarm() {
    if (!armed || previewLock) return;
    armed = null;
    plate.removeAttribute('data-armed');
    Array.prototype.forEach.call(zoneHost.querySelectorAll('.zone'), function (z) {
      z.setAttribute('data-armed-me', '0');
    });
    restoreBase();
  }

  function commitZone(id) {
    var group = activeGroup;
    clearZones();
    if (group === 'entry') { onEntry(id); }
    else if (group === 'verb') { onVerb(id); }
    else if (group === 'consent') { onConsent(id); }
  }

  /* ---------------- FLOW ---------------- */
  function onEntry(id) {
    path = id;                       // 'sworn' | 'cross'
    baseState = id;                  // path mood becomes the resting ambient
    setState(baseState);
    currentBeat = 1;
    playStatement(1);
  }

  function playStatement(beat) {
    phase = 'statement';
    plate.setAttribute('data-phase', 'statement');
    currentBeat = beat;
    stageBeat(STATEMENTS[path][beat], function () { showZones('verb', true); phase = 'verb'; plate.setAttribute('data-phase','verb'); });
  }

  function onVerb(id) {
    // one-line echo, then advance
    var echo = ECHO[currentBeat][id];
    stageBeat([{ cls: 'echo', text: echo }], function () {
      if (currentBeat < 3) { playStatement(currentBeat + 1); }
      else { playConsentLead(); }
    }, true /* short single-line */);
  }

  function playConsentLead() {
    phase = 'consentLead';
    plate.setAttribute('data-phase', 'consentLead');
    stageBeat(CONSENT_LEAD[path], function () {
      showZones('consent', true); phase = 'consent'; plate.setAttribute('data-phase','consent');
    });
  }

  function onConsent(id) {
    phase = 'answer';
    plate.setAttribute('data-phase', 'answer');
    if (id === 'donotask') {
      consentResult = 'not asked';
      playClosing();
      return;
    }
    // ASK: the room holds still (~2s), then Ellis answers per path
    baseState = 'stillness';
    setState('stillness');
    previewLock = true;
    var hold = reduceMotion ? 0 : 2000;
    seqTimer = window.setTimeout(function () {
      previewLock = false;
      if (path === 'sworn') {
        consentResult = 'asked-yes';
        stageBeat(CONSENT_ANSWER.sworn, function () { baseState = 'sworn'; setState('sworn'); playClosing(); });
      } else {
        consentResult = 'asked-no';
        stageBeat(CONSENT_ANSWER.cross, function () { refusalHold(); });
      }
    }, hold);
  }

  /* THE REFUSAL, WITNESSED — room dims, Ellis HOLDS at 0.66 unmoved, ~2.5s */
  function refusalHold() {
    baseState = 'refusal';
    setState('refusal');
    previewLock = true;
    var hold = reduceMotion ? 0 : 2500;
    seqTimer = window.setTimeout(function () {
      previewLock = false;
      playClosing(); // closing plays over the dimmed refusal composition
    }, hold);
  }

  function playClosing() {
    phase = 'closing';
    plate.setAttribute('data-phase', 'closing');
    // sworn / not-asked settle to path mood; cross refusal keeps its dim
    if (baseState !== 'refusal') { baseState = (path === 'cross') ? 'cross' : 'sworn'; setState(baseState); }
    stageBeat(CLOSING[path], function () { showStrip(); });
  }

  function showStrip() {
    phase = 'done';
    plate.setAttribute('data-phase', 'done');
    plate.setAttribute('data-beat', 'done');
    advanceHint.style.display = 'none';
    var entryLabel = (path === 'sworn') ? 'Sworn' : 'Cross-examined';
    rLine.innerHTML = 'Transcript committed <span class="sep">·</span> <b>' + entryLabel +
      '</b> <span class="sep">·</span> consent: <b>' + consentResult + '</b>';
    plate.setAttribute('data-result', '1');
  }

  /* ---------------- STAGED BEAT PLAYER ---------------- */
  function stageBeat(queue, done, shortSingle) {
    window.clearTimeout(beatTimer);
    plate.setAttribute('data-beat', 'playing');
    beatEl.innerHTML = '';
    beatQueue = queue;
    beatIndex = 0;
    beatDone = done;

    if (reduceMotion) {
      queue.forEach(function (ln) { addLine(ln, true); });
      beatIndex = queue.length;
      finishBeat();
      return;
    }
    if (shortSingle) {
      // single echo line: show, hold, then continue automatically
      addLine(queue[0], false);
      beatIndex = 1;
      beatTimer = window.setTimeout(finishBeat, 1700);
      return;
    }
    nextLine();
  }

  function addLine(ln, instant) {
    var p = document.createElement('p');
    p.className = 'beat-line ' + ln.cls;
    p.textContent = ln.text;
    beatEl.appendChild(p);
    if (instant) { p.classList.add('show'); }
    else { void p.offsetWidth; requestAnimationFrame(function () { p.classList.add('show'); }); }
    return p;
  }

  function nextLine() {
    if (beatIndex >= beatQueue.length) { finishBeat(); return; }
    var ln = beatQueue[beatIndex];
    addLine(ln, false);
    beatIndex++;
    window.clearTimeout(beatTimer);
    beatTimer = window.setTimeout(nextLine, lineHold(ln.text));
  }

  function advanceBeat() {
    if (plate.getAttribute('data-beat') !== 'playing') return;
    if (reduceMotion) return;
    window.clearTimeout(beatTimer);
    if (beatIndex < beatQueue.length) {
      while (beatIndex < beatQueue.length) { addLine(beatQueue[beatIndex], true); beatIndex++; }
      return; // let them read the full stanza; next press finishes
    }
    finishBeat();
  }

  function finishBeat() {
    window.clearTimeout(beatTimer);
    plate.setAttribute('data-beat', 'done');
    var cb = beatDone; beatDone = null;
    if (cb) cb();
  }

  /* ---------------- GLOBAL INPUT ---------------- */
  document.addEventListener('click', function (e) {
    if (e.target.closest('.zone') || e.target.closest('.r-replay') || e.target.closest('.rm-toggle')) return;
    if (plate.getAttribute('data-beat') === 'playing') { advanceBeat(); return; }
    if (armed) { disarm(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (armed) { var a = armed; disarm(); var el = zoneHost.querySelector('.zone[data-choice="' + a + '"]'); if (el) el.focus(); }
      return;
    }
    if (plate.getAttribute('data-beat') === 'playing') {
      if (e.key === 'Tab') return;               // let focus move
      var onZone = e.target && e.target.closest && e.target.closest('.zone');
      if (onZone && (e.key === 'Enter' || e.key === ' ')) return; // let native button activation run
      e.preventDefault();
      advanceBeat();
    }
  });

  /* ---------------- REPLAY ---------------- */
  rReplay.addEventListener('click', function (e) { e.preventDefault(); resetAll(); });

  function resetAll() {
    window.clearTimeout(beatTimer);
    window.clearTimeout(seqTimer);
    path = null; baseState = 'rest'; phase = 'entry';
    currentBeat = 1; consentResult = null; armed = null; activeGroup = null;
    previewLock = false; beatQueue = null; beatDone = null; beatIndex = 0;
    beatEl.innerHTML = '';
    clearZones();
    plate.removeAttribute('data-beat');
    plate.removeAttribute('data-result');
    plate.setAttribute('data-phase', 'entry');
    setState('rest');
    advanceHint.style.display = '';
    showZones('entry', false);
  }

  /* ---------------- REDUCE MOTION ---------------- */
  function applyReduceMotion(on) {
    reduceMotion = on;
    body.classList.toggle('reduce-motion', on);
    rmToggle.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (on) stopDust(); else startDust();
  }
  rmToggle.addEventListener('click', function () { applyReduceMotion(!reduceMotion); });

  /* ---------------- DUST CANVAS (killed under reduce-motion) ---------------- */
  var ctx = canvas.getContext('2d');
  var motes = [];
  var raf = null, lastW = 0, lastH = 0, prevT = 0;

  function sizeCanvas() {
    var r = plate.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(r.width * dpr));
    canvas.height = Math.max(1, Math.floor(r.height * dpr));
    canvas.style.width = r.width + 'px';
    canvas.style.height = r.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lastW = r.width; lastH = r.height;
    seedMotes(r.width, r.height);
  }
  function seedMotes(w, h) {
    motes = [];
    var n = Math.round((w * h) / 42000);
    for (var i = 0; i < n; i++) {
      // bias toward the shaft cone (center, upper-mid)
      var cx = w * (0.34 + Math.random() * 0.34);
      motes.push({
        x: cx, y: Math.random() * h,
        r: 0.6 + Math.random() * 1.4,
        vx: (Math.random() - 0.5) * 6,
        vy: 4 + Math.random() * 12,
        a: 0.10 + Math.random() * 0.22,
        ph: Math.random() * Math.PI * 2
      });
    }
  }
  function drawDust(t) {
    if (reduceMotion) return;
    if (!prevT) prevT = t;
    var dt = Math.min(0.05, (t - prevT) / 1000);
    prevT = t;
    ctx.clearRect(0, 0, lastW, lastH);

    var st = plate.getAttribute('data-state');
    var speed = 1, alpha = 1, hue = '90';
    if (st === 'sworn' || st === 'corroborate') { speed = 0.4; alpha = 0.9; hue = '78'; }
    else if (st === 'letstand' || st === 'rest') { speed = 0.5; alpha = 0.85; hue = '88'; }
    else if (st === 'cross') { speed = 1.6; alpha = 1.15; hue = '205'; }
    else if (st === 'interrupt') { speed = 1.9; alpha = 1.3; hue = '205'; }
    else if (st === 'stillness') { speed = 0; alpha = 0.8; hue = '92'; }
    else if (st === 'refusal') { speed = 0; alpha = 0.55; hue = '205'; }

    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      m.ph += dt;
      m.y += m.vy * speed * dt;
      m.x += (m.vx * speed + Math.sin(m.ph) * 3) * dt;
      if (m.y - m.r > lastH) { m.y = -m.r; m.x = lastW * (0.34 + Math.random() * 0.34); }
      if (m.x < 0) m.x = lastW; else if (m.x > lastW) m.x = 0;
      ctx.beginPath();
      ctx.fillStyle = 'oklch(0.9 0.05 ' + hue + ' / ' + (m.a * alpha).toFixed(3) + ')';
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fill();
    }
    raf = requestAnimationFrame(drawDust);
  }
  function startDust() {
    if (reduceMotion || raf) return;
    sizeCanvas(); prevT = 0; raf = requestAnimationFrame(drawDust);
  }
  function stopDust() {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    if (ctx) ctx.clearRect(0, 0, lastW, lastH);
  }
  window.addEventListener('resize', function () { if (!reduceMotion) sizeCanvas(); });

  /* ---------------- INIT ---------------- */
  showZones('entry', false);
  var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  applyReduceMotion(mq.matches);

  /* ---- capture-support driver: ?shot=<name> jumps to one composition for an
     evidence still. Purely for screenshots; gated behind the query param so it
     never runs in normal play. ---- */
  (function shotDriver() {
    var params = new URLSearchParams(location.search);
    var shot = params.get('shot');
    if (!shot) return;
    if (params.get('rm') === '1') applyReduceMotion(true);
    else stopDust();   // idle the canvas rAF so a headless capture can settle & exit
                       // (dust is a motion flourish; stills read fine without it)
    function renderInstant(queue) {
      beatEl.innerHTML = '';
      queue.forEach(function (ln) { addLine(ln, true); });
      plate.setAttribute('data-beat', 'done');
    }
    function hover(choice) {
      var z = zoneHost.querySelector('.zone[data-choice="' + choice + '"]');
      if (z) z.setAttribute('data-hover', '1');
    }
    if (shot === 'rest') { /* default entry scene */ }
    else if (shot === 'entry-sworn') { plate.setAttribute('data-phase','statement'); setState('sworn'); hover('sworn'); }
    else if (shot === 'entry-cross') { plate.setAttribute('data-phase','statement'); setState('cross'); hover('cross'); }
    else if (shot === 'verb') {
      path = 'sworn'; baseState = 'sworn'; plate.setAttribute('data-phase','verb');
      renderInstant(STATEMENTS.sworn[1]); showZones('verb', false); setState('interrupt'); hover('interrupt');
    }
    else if (shot === 'consent') {
      path = 'cross'; baseState = 'cross'; plate.setAttribute('data-phase','consent');
      renderInstant(CONSENT_LEAD.cross); showZones('consent', false); setState('cross'); hover('ask');
    }
    else if (shot === 'refusal') {
      clearZones();
      path = 'cross'; baseState = 'refusal'; plate.setAttribute('data-phase','answer');
      renderInstant(CONSENT_ANSWER.cross); setState('refusal');
    }
    else if (shot === 'closing') {
      clearZones();
      path = 'cross'; consentResult = 'asked-no'; baseState = 'refusal';
      plate.setAttribute('data-phase','closing'); setState('refusal');
      renderInstant(CLOSING.cross); showStrip();
    }
  })();

  /* deterministic hooks for verification */
  window.__deposition = {
    activate: activate,
    commit: function (id) {
      var el = zoneHost.querySelector('.zone[data-choice="' + id + '"]');
      if (!el) return false;
      el.click(); el.click(); return true;   // real arm→confirm via el.click()
    },
    getState: function () { return plate.getAttribute('data-state'); },
    getPhase: function () { return phase; },
    getPath: function () { return path; },
    getConsent: function () { return consentResult; },
    isReduceMotion: function () { return reduceMotion; },
    setReduceMotion: applyReduceMotion,
    reset: resetAll,
    beatText: function () { return beatEl.textContent; },
    stripText: function () { return rLine.textContent; }
  };
})();
</script>
</body>
</html>
