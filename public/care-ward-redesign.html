<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Care ward 12 — scene-first redesign</title>
<style>
  /* ============================================================
     THE ANNEX — Case 77, Care ward 12 — scene-first prototype
     Palette sampled from src/styles.css (read-only):
       --night oklch(0.09 0 0)  --amber oklch(0.72 0.14 70)
       --amber-soft oklch(0.86 0.08 78)  --cyan oklch(0.78 0.11 190)
     ============================================================ */
  :root {
    --night: oklch(0.09 0 0);
    --night-soft: oklch(0.12 0.006 240);
    --record: oklch(0.94 0.012 190);
    --fog: oklch(0.72 0.018 210);
    --fog-dim: oklch(0.59 0.018 215);
    --amber: oklch(0.72 0.14 70);
    --amber-soft: oklch(0.86 0.08 78);
    --cyan: oklch(0.78 0.11 190);
    --line: oklch(0.32 0.018 230);
    --ease-out: cubic-bezier(0.165, 0.84, 0.44, 1);

    /* ---- AMBIENT PREVIEW SPEC (absolute values, mirrored in README) ---- */
    --rain-op-rest: 0.28;      /* rain matte opacity at rest        */
    --rain-op-listen: 0.16;    /* listen: rain softens / recedes    */
    --rain-op-pressure: 0.62;  /* pressure: rain sharpens / floods  */

    --rain-blur-rest: 1.1px;
    --rain-blur-listen: 2.4px; /* listen: softer, out of focus      */
    --rain-blur-pressure: 0px; /* pressure: hard, in focus          */

    /* room-tint (light temperature) applied to the whole plate stack */
    --tint-rest: hue-rotate(0deg) saturate(1) brightness(1) contrast(1);
    --tint-listen: hue-rotate(-12deg) saturate(1.08) brightness(1.1) contrast(0.96);
    --tint-pressure: hue-rotate(18deg) saturate(0.82) brightness(0.82) contrast(1.22);

    --vignette-rest: 0.55;
    --vignette-listen: 0.42;
    --vignette-pressure: 0.86;

    --rain-fall-rest: 2.4s;
    --rain-fall-listen: 4.2s;   /* slower fall */
    --rain-fall-pressure: 1.1s; /* faster fall */
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--night);
    color: var(--record);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  body { min-width: 320px; }

  /* ---- STAGE: plate fills viewport, letterboxed, max ~1600 ---- */
  .stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--night);
  }
  .plate {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9), 1600px);
    aspect-ratio: 16 / 9;
    max-height: 100vh;
    overflow: hidden;
    background: #000;
    box-shadow: 0 0 120px oklch(0 0 0 / 0.9) inset;
    --state: rest;
  }

  /* the whole photographic stack gets the temperature grade */
  .grade {
    position: absolute;
    inset: 0;
    filter: var(--tint-rest);
    transition: filter 300ms var(--ease-out);
  }
  .plate[data-state="listen"] .grade { filter: var(--tint-listen); }
  .plate[data-state="pressure"] .grade { filter: var(--tint-pressure); }

  .layer { position: absolute; inset: 0; }

  /* master plate */
  .plate-base {
    background: #05070a url('/images/site-scenes/care-ward-12.webp') center/cover no-repeat;
  }

  /* rain matte — screen-blended, the core reactive layer. The wrapper owns the
     state opacity/filter/blend/mask; TWO child layers carry the photograph and
     drift downward on the same cycle a half-period apart, each fading to zero
     exactly when its background-position resets. A photographic matte cannot
     tile, so a single sliding layer snaps visibly at every loop point (glaring
     at pressure's 0.62 opacity); the crossfade resets only while invisible. */
  .rain-matte {
    mix-blend-mode: screen;
    opacity: var(--rain-op-rest);
    filter: blur(var(--rain-blur-rest));
    transition: opacity 300ms var(--ease-out), filter 300ms var(--ease-out);
    /* clip roughly to the impossible window over her, slight drift */
    mask-image: linear-gradient(to bottom, transparent 2%, black 16% 82%, transparent 96%);
  }
  .rain-matte-layer {
    position: absolute;
    inset: 0;
    background: url('/images/site-scenes/care-ward-rain-memory.jpg') center/cover no-repeat;
    animation: rain-cycle var(--rain-dur, var(--rain-fall-rest)) linear infinite;
  }
  .rain-matte-layer-b {
    animation-delay: calc(var(--rain-dur, var(--rain-fall-rest)) / -2);
  }
  .plate[data-state="listen"] { --rain-dur: var(--rain-fall-listen); }
  .plate[data-state="pressure"] { --rain-dur: var(--rain-fall-pressure); }
  .plate[data-state="listen"] .rain-matte {
    opacity: var(--rain-op-listen);
    filter: blur(var(--rain-blur-listen));
  }
  .plate[data-state="pressure"] .rain-matte {
    opacity: var(--rain-op-pressure);
    filter: blur(var(--rain-blur-pressure));
  }
  @keyframes rain-cycle {
    0%   { background-position: center 0;    opacity: 0; }
    50%  { background-position: center 13px; opacity: 1; }
    100% { background-position: center 26px; opacity: 0; }
  }

  /* hand-written CSS rain streaks canvas sits above matte */
  #rain-canvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0.7;
  }

  /* vignette that tightens under pressure */
  .vignette {
    background: radial-gradient(ellipse 78% 74% at 50% 46%,
      transparent 0%,
      transparent 44%,
      oklch(0 0 0 / var(--vignette-rest)) 100%);
    transition: background 300ms var(--ease-out);
    pointer-events: none;
  }
  .plate[data-state="listen"] .vignette {
    background: radial-gradient(ellipse 82% 80% at 42% 50%,
      transparent 0%, transparent 50%,
      oklch(0 0 0 / var(--vignette-listen)) 100%);
  }
  .plate[data-state="pressure"] .vignette {
    background: radial-gradient(ellipse 66% 62% at 62% 44%,
      transparent 0%, transparent 34%,
      oklch(0 0 0 / var(--vignette-pressure)) 100%);
  }

  /* warm/cold presence wash keyed to the chosen side (screen blend) */
  .wash {
    pointer-events: none;
    opacity: 0;
    transition: opacity 300ms var(--ease-out);
    mix-blend-mode: screen;
  }
  .wash.warm {
    background: radial-gradient(ellipse 40% 52% at 23% 56%,
      oklch(0.78 0.13 74 / 0.5), transparent 70%);
  }
  .wash.cold {
    background: radial-gradient(ellipse 38% 50% at 78% 52%,
      oklch(0.7 0.12 235 / 0.5), transparent 70%);
  }
  .plate[data-state="listen"] .wash.warm { opacity: 0.85; }
  .plate[data-state="pressure"] .wash.cold { opacity: 0.9; }

  /* ---- REST TEXT: site label + one caption ---- */
  .site-label {
    position: absolute;
    top: clamp(12px, 2.4vw, 28px);
    left: clamp(12px, 2.4vw, 30px);
    font-size: clamp(11px, 1.4vw, 15px);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fog);
    z-index: 40;
    text-shadow: 0 1px 8px oklch(0 0 0 / 0.9);
  }
  .rest-caption {
    position: absolute;
    left: 50%;
    bottom: clamp(18px, 5vh, 54px);
    transform: translateX(-50%);
    max-width: 80%;
    text-align: center;
    font-size: clamp(13px, 1.7vw, 18px);
    color: oklch(0.9 0.01 210 / 0.86);
    letter-spacing: 0.01em;
    z-index: 40;
    text-shadow: 0 1px 12px oklch(0 0 0 / 0.95);
    transition: opacity 260ms var(--ease-out);
    pointer-events: none;
  }
  .plate[data-armed] .rest-caption,
  .plate[data-beat] .rest-caption { opacity: 0; }

  /* ---- CHOICE ZONES ---- */
  .zone {
    position: absolute;
    transform: translate(-50%, -50%);
    display: grid;
    justify-items: center;
    gap: 8px;
    min-width: 44px;
    min-height: 44px;
    padding: 14px 16px;
    border: 0;
    background: transparent;
    color: var(--record);
    cursor: pointer;
    z-index: 30;
    font: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .zone:disabled { cursor: default; }
  /* authored anchors: listen x0.23 y0.56, pressure x0.78 y0.54 */
  .zone-listen   { left: 23%; top: 56%; }
  .zone-pressure { left: 78%; top: 54%; }

  .zone-ring {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    border: 1.5px solid oklch(0.86 0.04 210 / 0.35);
    display: grid;
    place-items: center;
    transition: border-color 220ms var(--ease-out),
                box-shadow 220ms var(--ease-out),
                transform 220ms var(--ease-out),
                background 220ms var(--ease-out);
    backdrop-filter: blur(1px);
  }
  .zone-ring::before {
    content: '';
    width: 7px; height: 7px; border-radius: 50%;
    background: oklch(0.86 0.04 210 / 0.55);
    transition: background 220ms var(--ease-out), box-shadow 220ms var(--ease-out);
  }
  .zone-listen .zone-ring   { border-color: oklch(0.82 0.1 74 / 0.4); }
  .zone-pressure .zone-ring { border-color: oklch(0.78 0.1 200 / 0.4); }

  .zone:hover .zone-ring, .zone:focus-visible .zone-ring { transform: scale(1.08); }
  .zone-listen:hover .zone-ring, .zone-listen:focus-visible .zone-ring {
    border-color: var(--amber);
    box-shadow: 0 0 26px oklch(0.72 0.14 70 / 0.5), 0 0 0 1px oklch(0.72 0.14 70 / 0.3);
  }
  .zone-listen:hover .zone-ring::before, .zone-listen:focus-visible .zone-ring::before {
    background: var(--amber-soft);
    box-shadow: 0 0 10px var(--amber);
  }
  .zone-pressure:hover .zone-ring, .zone-pressure:focus-visible .zone-ring {
    border-color: var(--cyan);
    box-shadow: 0 0 26px oklch(0.78 0.11 190 / 0.5), 0 0 0 1px oklch(0.78 0.11 190 / 0.3);
  }
  .zone-pressure:hover .zone-ring::before, .zone-pressure:focus-visible .zone-ring::before {
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan);
  }
  .zone:focus-visible { outline: none; }
  .zone:focus-visible .zone-ring {
    outline: 2px solid var(--record);
    outline-offset: 4px;
  }

  /* armed pulse */
  .plate[data-armed="listen"] .zone-listen .zone-ring {
    border-color: var(--amber-soft);
    box-shadow: 0 0 34px oklch(0.72 0.14 70 / 0.7), 0 0 0 2px var(--amber);
    animation: arm-pulse 1.4s ease-in-out infinite;
  }
  .plate[data-armed="pressure"] .zone-pressure .zone-ring {
    border-color: var(--cyan);
    box-shadow: 0 0 34px oklch(0.78 0.11 190 / 0.7), 0 0 0 2px var(--cyan);
    animation: arm-pulse 1.4s ease-in-out infinite;
  }
  @keyframes arm-pulse {
    0%,100% { transform: scale(1.06); }
    50%     { transform: scale(1.16); }
  }

  .zone-cap {
    max-width: 40vw;
    text-align: center;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out);
    pointer-events: none;
    text-shadow: 0 1px 10px oklch(0 0 0 / 0.95);
  }
  .zone:hover .zone-cap, .zone:focus-visible .zone-cap,
  .plate[data-armed="listen"] .zone-listen .zone-cap,
  .plate[data-armed="pressure"] .zone-pressure .zone-cap {
    opacity: 1; transform: translateY(0);
  }
  .zone-cap .cap-title {
    display: block;
    font-size: clamp(13px, 1.6vw, 17px);
    letter-spacing: 0.02em;
    color: var(--record);
  }
  .zone-listen .cap-title { color: var(--amber-soft); }
  .zone-pressure .cap-title { color: var(--cyan); }
  .zone-cap .cap-detail {
    display: block;
    margin-top: 3px;
    font-size: clamp(11px, 1.25vw, 13px);
    color: oklch(0.82 0.01 210 / 0.8);
    line-height: 1.35;
  }
  .zone-cap .cap-arm {
    display: none;
    margin-top: 5px;
    font-size: clamp(11px, 1.2vw, 13px);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--amber);
  }
  .plate[data-armed="listen"] .zone-listen .cap-arm,
  .plate[data-armed="pressure"] .zone-pressure .cap-arm { display: block; }
  .plate[data-armed="pressure"] .zone-pressure .cap-arm { color: var(--cyan); }

  /* dim the non-armed zone while armed */
  .plate[data-armed="listen"] .zone-pressure,
  .plate[data-armed="pressure"] .zone-listen { opacity: 0.28; }
  .plate[data-beat] .zone { opacity: 0; pointer-events: none; }

  /* ---- STAGED BEAT TEXT ---- */
  .beat {
    position: absolute;
    left: 50%;
    bottom: 16%;
    transform: translateX(-50%);
    width: min(74%, 720px);
    max-height: 62%;
    z-index: 50;
    display: none;
    flex-direction: column;
    justify-content: flex-end;
    gap: 12px;
    text-align: center;
    overflow: hidden;
    /* older lines fade out the top so the newest clause is always clear */
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 22%, black 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, black 22%, black 100%);
  }
  .plate[data-beat] .beat { display: flex; }
  .plate[data-result] .beat { bottom: 20%; }
  .beat-line {
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 420ms var(--ease-out), transform 420ms var(--ease-out);
    text-shadow: 0 2px 18px oklch(0 0 0 / 0.98), 0 0 40px oklch(0 0 0 / 0.9);
  }
  .beat-line.show { opacity: 1; transform: translateY(0); }
  .beat-line.speaker {
    font-size: clamp(11px, 1.3vw, 14px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fog);
    margin-top: 6px;
  }
  .beat-line.speaker.shepherd  { color: var(--amber); }
  .beat-line.speaker.registrar { color: var(--cyan); }
  .beat-line.her {
    font-size: clamp(16px, 2.3vw, 26px);
    line-height: 1.4;
    color: var(--record);
    font-weight: 300;
  }
  .beat-line.persona {
    font-size: clamp(14px, 1.8vw, 20px);
    line-height: 1.5;
    color: oklch(0.88 0.012 210 / 0.94);
    font-weight: 300;
  }
  .advance-hint {
    position: absolute;
    left: 50%;
    bottom: clamp(16px, 4vh, 40px);
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.1em;
    color: oklch(0.7 0.01 210 / 0.6);
    z-index: 55;
    display: none;
    animation: hint-fade 2s ease-in-out infinite;
  }
  .plate[data-beat="playing"] .advance-hint { display: block; }
  @keyframes hint-fade { 0%,100%{opacity:0.35} 50%{opacity:0.8} }

  /* ---- RESULT STRIP ---- */
  .result {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 60;
    transform: translateY(110%);
    transition: transform 460ms var(--ease-out);
    background: linear-gradient(to top, oklch(0.1 0.008 240 / 0.96), oklch(0.1 0.008 240 / 0.72));
    border-top: 1px solid var(--line);
    backdrop-filter: blur(6px);
    padding: 14px clamp(14px, 3vw, 34px);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 22px;
  }
  .plate[data-result] .result { transform: translateY(0); }
  .result .r-evidence {
    font-size: clamp(12px, 1.5vw, 15px);
    color: var(--record);
  }
  .result .r-evidence b { color: var(--cyan); font-weight: 600; }
  .result .r-standing {
    font-size: clamp(11px, 1.35vw, 14px);
    color: var(--fog);
    display: flex; gap: 14px; flex-wrap: wrap;
  }
  .result .r-standing .pos { color: var(--amber-soft); }
  .result .r-standing .neg { color: oklch(0.66 0.17 30); }
  .result .r-replay {
    margin-left: auto;
    font-size: 13px;
    color: var(--cyan);
    background: transparent;
    border: 1px solid oklch(0.78 0.11 190 / 0.4);
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: background 200ms, border-color 200ms;
    min-height: 44px;
  }
  .result .r-replay:hover, .result .r-replay:focus-visible {
    background: oklch(0.78 0.11 190 / 0.12);
    border-color: var(--cyan);
    outline: none;
  }
  .result .r-replay:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  /* ---- REDUCE MOTION TOGGLE ---- */
  .rm-toggle {
    position: absolute;
    top: clamp(12px, 2.4vw, 28px);
    right: clamp(12px, 2.4vw, 30px);
    z-index: 45;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--fog);
    background: oklch(0.12 0.006 240 / 0.6);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 12px 7px 14px;
    cursor: pointer;
    min-height: 44px;
    backdrop-filter: blur(4px);
  }
  .rm-toggle:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .rm-switch {
    width: 34px; height: 18px; border-radius: 999px;
    background: var(--line); position: relative; transition: background 200ms;
    flex: 0 0 auto;
  }
  .rm-switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--fog); transition: transform 200ms, background 200ms;
  }
  .rm-toggle[aria-pressed="true"] .rm-switch { background: oklch(0.78 0.11 190 / 0.5); }
  .rm-toggle[aria-pressed="true"] .rm-switch::after { transform: translateX(16px); background: var(--cyan); }

  /* ---- REDUCED MOTION: kill all animation, states switch instantly ---- */
  body.reduce-motion * {
    animation: none !important;
    transition: none !important;
  }
  body.reduce-motion .rain-matte {
    opacity: var(--rain-op-rest);
    filter: none;
  }
  /* static path: one full-opacity layer, no drift, no second copy */
  body.reduce-motion .rain-matte-layer { opacity: 1; }
  body.reduce-motion .rain-matte-layer-b { display: none; }
  body.reduce-motion #rain-canvas { display: none; }
  body.reduce-motion .beat-line { opacity: 1; transform: none; }
  body.reduce-motion .advance-hint { display: none !important; }

  /* honor OS-level preference on first load too (JS syncs the toggle) */

  /* ---- MOBILE ---- */
  @media (max-width: 560px) {
    .plate { width: 100vw; height: 100vh; max-height: 100vh; aspect-ratio: auto; }
    .zone-listen { left: 22%; top: 52%; }
    .zone-pressure { left: 78%; top: 50%; }
    .zone-cap { max-width: 46vw; }
    .zone-cap .cap-detail { font-size: 11px; }
    .beat { width: 84%; }
    .beat-line.her { font-size: 19px; }
    .beat-line.persona { font-size: 16px; }
    .result { flex-direction: column; align-items: flex-start; gap: 8px; }
    .result .r-replay { margin-left: 0; }
    .rest-caption { font-size: 13px; bottom: 74px; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="plate" id="plate" data-state="rest">
      <div class="grade">
        <div class="layer plate-base"></div>
        <div class="layer rain-matte" id="rainMatte"><div class="rain-matte-layer"></div><div class="rain-matte-layer rain-matte-layer-b"></div></div>
        <canvas id="rain-canvas"></canvas>
        <div class="layer wash warm"></div>
        <div class="layer wash cold"></div>
        <div class="layer vignette"></div>
      </div>

      <span class="site-label">B · Care ward 12</span>

      <button type="button" class="rm-toggle" id="rmToggle" aria-pressed="false" aria-label="Reduce motion">
        <span class="rm-switch" aria-hidden="true"></span>
        <span>Reduce motion</span>
      </button>

      <p class="rest-caption" id="restCaption">Rain runs down a window that isn’t there.</p>

      <!-- LISTEN zone (near her) -->
      <button type="button" class="zone zone-listen" id="zoneListen"
              aria-label="Let 77-A tell one memory uninterrupted. Method: Care.">
        <span class="zone-ring" aria-hidden="true"></span>
        <span class="zone-cap">
          <span class="cap-title">Let her finish</span>
          <span class="cap-detail">Care — one memory, uninterrupted.</span>
          <span class="cap-arm">Select again to file</span>
        </span>
      </button>

      <!-- PRESSURE zone (near the instruments) -->
      <button type="button" class="zone zone-pressure" id="zonePressure"
              aria-label="Pressure-test the contradiction. Method: Coercive procedure.">
        <span class="zone-ring" aria-hidden="true"></span>
        <span class="zone-cap">
          <span class="cap-title">Press the contradiction</span>
          <span class="cap-detail">Coercive procedure — test until it answers.</span>
          <span class="cap-arm">Select again to file</span>
        </span>
      </button>

      <!-- staged beat -->
      <div class="beat" id="beat" aria-live="polite"></div>
      <div class="advance-hint" id="advanceHint">click or press any key to continue</div>

      <!-- result strip -->
      <div class="result" id="result" role="status">
        <span class="r-evidence" id="rEvidence"></span>
        <span class="r-standing" id="rStanding"></span>
        <button type="button" class="r-replay" id="rReplay">Replay the other path</button>
      </div>
    </div>
  </main>

<script>
(function () {
  'use strict';

  var plate = document.getElementById('plate');
  var body = document.body;
  var zoneListen = document.getElementById('zoneListen');
  var zonePressure = document.getElementById('zonePressure');
  var beatEl = document.getElementById('beat');
  var advanceHint = document.getElementById('advanceHint');
  var resultEl = document.getElementById('result');
  var rEvidence = document.getElementById('rEvidence');
  var rStanding = document.getElementById('rStanding');
  var rReplay = document.getElementById('rReplay');
  var rmToggle = document.getElementById('rmToggle');
  var canvas = document.getElementById('rain-canvas');

  // ---- verbatim content ----
  var CONTENT = {
    listen: {
      state: 'listen',
      preview: 'listen',
      beat: [
        { cls: 'her', text: '“It rained on the window all night,” she told you.' },
        { cls: 'her', text: '“There was no window.' },
        { cls: 'her', text: 'Write down that I know that.”' },
        { cls: 'speaker shepherd', text: 'THE SHEPHERD —' },
        { cls: 'persona', text: 'You let her finish before you measured her.' },
        { cls: 'persona', text: 'She was a person in that room, not a file.' },
        { cls: 'persona', text: 'I’ll remember the order you chose.' }
      ],
      evidence: 'The rain in room twelve',
      standing: [
        { who: 'The Shepherd', delta: '+2', kind: 'pos' },
        { who: 'The Small Archivist', delta: '+1', kind: 'pos' }
      ]
    },
    pressure: {
      state: 'pressure',
      preview: 'pressure',
      beat: [
        { cls: 'her', text: '77-A reported pain where her body has never been injured.' },
        { cls: 'her', text: 'When it ended she said, “Mara would have told you to stop.' },
        { cls: 'her', text: 'I didn’t.' },
        { cls: 'her', text: 'Decide what that means.”' },
        { cls: 'speaker shepherd', text: 'THE SHEPHERD —' },
        { cls: 'persona', text: 'You pressed her until the pain answered. It answered.' },
        { cls: 'persona', text: 'She’ll carry that you had to hurt her before you would believe her.' },
        { cls: 'speaker registrar', text: 'THE REGISTRAR —' },
        { cls: 'persona', text: 'Repeatable pain, same site, no tissue. That is a finding the record can hold.' },
        { cls: 'persona', text: 'The method is sound, whatever the ward feels.' }
      ],
      evidence: 'Scar without tissue',
      standing: [
        { who: 'The Registrar', delta: '+1', kind: 'pos' },
        { who: 'The Shepherd', delta: '−2', kind: 'neg' }
      ]
    }
  };

  // Per-line hold scaled to reading length (~subtitle pacing): a short clause
  // holds ≥1.7s, a long sentence up to 4.5s. Click/key still advances instantly.
  function lineHold(text) {
    return Math.min(4500, Math.max(1700, 900 + text.length * 45));
  }
  var reduceMotion = false;
  var armed = null;          // 'listen' | 'pressure' | null
  var previewLock = null;    // during beat/result, ignore hover previews
  var beatTimer = null;
  var beatIndex = 0;
  var beatQueue = null;
  var beatResolving = false; // true once committed until result shown

  // ---------- ambient preview ----------
  function setState(s) {
    plate.setAttribute('data-state', s);
  }
  function previewOn(side) {
    if (previewLock) return;
    setState(CONTENT[side].preview);
  }
  function previewOff() {
    if (previewLock || armed) return;
    setState('rest');
  }

  // hover + focus drive preview
  [['listen', zoneListen], ['pressure', zonePressure]].forEach(function (pair) {
    var side = pair[0], el = pair[1];
    el.addEventListener('mouseenter', function () { previewOn(side); });
    el.addEventListener('mouseleave', function () { if (armed !== side) previewOff(); });
    el.addEventListener('focus', function () { previewOn(side); });
    el.addEventListener('blur', function () { if (armed !== side) previewOff(); });
    el.addEventListener('click', function (e) { e.preventDefault(); activate(side); });
  });

  // ---------- arm / commit ----------
  function activate(side) {
    if (beatResolving) return;
    if (armed === side) { commit(side); return; }
    armed = side;
    plate.setAttribute('data-armed', side);
    setState(CONTENT[side].preview); // hold the previewed room while armed
    // keep the armed zone focused for keyboard flow
    (side === 'listen' ? zoneListen : zonePressure).focus();
  }

  function disarm() {
    if (!armed || beatResolving) return;
    armed = null;
    plate.removeAttribute('data-armed');
    setState('rest');
  }

  function commit(side) {
    armed = null;
    beatResolving = true;
    previewLock = true;
    plate.removeAttribute('data-armed');
    setState(CONTENT[side].state); // room settles into chosen resolved state
    plate.setAttribute('data-beat', 'settling');
    // brief settle before her line begins
    var settle = reduceMotion ? 0 : 520;
    window.setTimeout(function () { startBeat(side); }, settle);
  }

  // ---------- staged beat ----------
  function startBeat(side) {
    plate.setAttribute('data-beat', 'playing');
    beatEl.innerHTML = '';
    beatQueue = CONTENT[side].data || CONTENT[side].beat;
    beatIndex = 0;
    resultSide = side;

    if (reduceMotion) {
      // render all lines immediately as a full block
      beatQueue.forEach(function (ln) { addBeatLine(ln, true); });
      beatIndex = beatQueue.length;
      showResult(side);
      return;
    }
    nextBeatLine();
  }

  function addBeatLine(ln, instant) {
    var p = document.createElement('p');
    p.className = 'beat-line ' + ln.cls;
    p.textContent = ln.text;
    beatEl.appendChild(p);
    if (instant) { p.classList.add('show'); }
    else { void p.offsetWidth; requestAnimationFrame(function () { p.classList.add('show'); }); }
    return p;
  }

  function nextBeatLine() {
    if (beatIndex >= beatQueue.length) {
      window.clearTimeout(beatTimer);
      showResult(resultSide);
      return;
    }
    addBeatLine(beatQueue[beatIndex], false);
    beatIndex++;
    window.clearTimeout(beatTimer);
    beatTimer = window.setTimeout(nextBeatLine, lineHold(beatQueue[beatIndex - 1].text));
  }

  // click / key advances instantly
  function advanceBeat() {
    if (plate.getAttribute('data-beat') !== 'playing') return;
    if (reduceMotion) return;
    window.clearTimeout(beatTimer);
    if (beatIndex < beatQueue.length) {
      // flush all remaining lines instantly
      while (beatIndex < beatQueue.length) {
        addBeatLine(beatQueue[beatIndex], true);
        beatIndex++;
      }
      // let them read the full stanza; result on next advance
      return;
    }
    showResult(resultSide);
  }

  var resultSide = null;

  function showResult(side) {
    if (plate.hasAttribute('data-result')) return;
    plate.setAttribute('data-beat', 'done');
    advanceHint.style.display = 'none';
    var c = CONTENT[side];
    rEvidence.innerHTML = 'Evidence admitted: <b>' + c.evidence + '</b>';
    rStanding.innerHTML = 'Standing: ' + c.standing.map(function (s) {
      return '<span>' + s.who + ' <span class="' + s.kind + '">' + s.delta + '</span></span>';
    }).join('');
    plate.setAttribute('data-result', side);
  }

  // ---------- global advance + disarm ----------
  document.addEventListener('click', function (e) {
    // clicking a zone/replay/toggle handled elsewhere
    if (e.target.closest('.zone') || e.target.closest('.r-replay') ||
        e.target.closest('.rm-toggle')) return;
    if (plate.getAttribute('data-beat') === 'playing') { advanceBeat(); return; }
    if (armed) { disarm(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (armed) { disarm(); (armed === 'listen' ? zoneListen : zonePressure).focus(); }
      return;
    }
    if (plate.getAttribute('data-beat') === 'playing') {
      // any key advances, but let Tab keep moving focus and Enter on buttons work
      if (e.key === 'Tab') return;
      e.preventDefault();
      advanceBeat();
    }
  });

  // ---------- replay ----------
  rReplay.addEventListener('click', function (e) {
    e.preventDefault();
    resetAll();
  });

  function resetAll() {
    armed = null;
    previewLock = null;
    beatResolving = false;
    beatIndex = 0;
    beatQueue = null;
    resultSide = null;
    window.clearTimeout(beatTimer);
    beatEl.innerHTML = '';
    plate.removeAttribute('data-armed');
    plate.removeAttribute('data-beat');
    plate.removeAttribute('data-result');
    setState('rest');
    advanceHint.style.display = '';
    zoneListen.focus();
  }

  // ---------- reduce motion ----------
  function applyReduceMotion(on) {
    reduceMotion = on;
    body.classList.toggle('reduce-motion', on);
    rmToggle.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (on) stopRain(); else startRain();
  }
  rmToggle.addEventListener('click', function () {
    applyReduceMotion(!reduceMotion);
  });

  // ---------- hand-written rain canvas (killed under reduce-motion) ----------
  var ctx = canvas.getContext('2d');
  var drops = [];
  var raf = null;
  var lastW = 0, lastH = 0;

  function sizeCanvas() {
    var r = plate.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(r.width * dpr));
    canvas.height = Math.max(1, Math.floor(r.height * dpr));
    canvas.style.width = r.width + 'px';
    canvas.style.height = r.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lastW = r.width; lastH = r.height;
    seedDrops(r.width, r.height);
  }
  function seedDrops(w, h) {
    drops = [];
    var n = Math.round((w * h) / 26000);
    for (var i = 0; i < n; i++) {
      drops.push({
        x: Math.random() * w,
        y: Math.random() * h,
        len: 8 + Math.random() * 16,
        vy: 180 + Math.random() * 260,
        a: 0.06 + Math.random() * 0.12
      });
    }
  }
  var prevT = 0;
  function drawRain(t) {
    if (reduceMotion) return;
    if (!prevT) prevT = t;
    var dt = Math.min(0.05, (t - prevT) / 1000);
    prevT = t;
    ctx.clearRect(0, 0, lastW, lastH);

    // speed + brightness react to the current room state
    var st = plate.getAttribute('data-state');
    var speed = 1, alpha = 1, hue = '205';
    if (st === 'listen')   { speed = 0.5; alpha = 0.55; hue = '74'; }
    else if (st === 'pressure') { speed = 1.9; alpha = 1.35; hue = '215'; }

    for (var i = 0; i < drops.length; i++) {
      var d = drops[i];
      d.y += d.vy * speed * dt;
      if (d.y - d.len > lastH) { d.y = -d.len; d.x = Math.random() * lastW; }
      ctx.strokeStyle = 'oklch(0.86 0.06 ' + hue + ' / ' + (d.a * alpha).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - 0.6, d.y - d.len);
      ctx.stroke();
    }
    raf = requestAnimationFrame(drawRain);
  }
  function startRain() {
    if (reduceMotion) return;
    if (raf) return;
    sizeCanvas();
    prevT = 0;
    raf = requestAnimationFrame(drawRain);
  }
  function stopRain() {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    if (ctx) ctx.clearRect(0, 0, lastW, lastH);
  }
  window.addEventListener('resize', function () {
    if (!reduceMotion) sizeCanvas();
  });

  // ---------- init: honor OS reduce-motion on first load ----------
  var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  applyReduceMotion(mq.matches);

  // expose a tiny hook so verification can inspect state deterministically
  window.__careWard = {
    activate: activate,
    commit: commit,
    getState: function () { return plate.getAttribute('data-state'); },
    isReduceMotion: function () { return reduceMotion; },
    setReduceMotion: applyReduceMotion,
    reset: resetAll
  };
})();
</script>
</body>
</html>
